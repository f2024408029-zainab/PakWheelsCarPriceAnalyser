<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PakWheels Car Price Analyser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">PW</span>
        <div class="brand-text">
          <h1>Car Price Analyser</h1>
          <p>Live listings, pulled straight off PakWheels</p>
        </div>
      </div>
      <div class="scrape-control">
        <div class="scrape-status" id="scrapeStatus">
          <span class="dot" id="scrapeDot"></span>
          <span id="scrapeStatusText">idle</span>
        </div>
        <button id="scrapeBtn" class="btn-primary">Scrape live data</button>
      </div>
    </div>
  </header>

  <main class="layout">

    <aside class="filters" id="filters">
      <h2>Narrow it down</h2>

      <div class="field">
        <label for="provinceSelect">Province</label>
        <select id="provinceSelect">
          <option value="">All provinces</option>
        </select>
      </div>

      <div class="field">
        <label for="citySelect">City</label>
        <select id="citySelect">
          <option value="">All cities</option>
        </select>
      </div>

      <div class="field">
        <label for="transmissionSelect">Transmission</label>
        <select id="transmissionSelect">
          <option value="">Manual or Automatic</option>
          <option value="Manual">Manual</option>
          <option value="Automatic">Automatic</option>
        </select>
      </div>

      <div class="field">
        <label for="makeInput">Make</label>
        <input list="makeList" id="makeInput" placeholder="e.g. Toyota" />
        <datalist id="makeList"></datalist>
      </div>

      <div class="field">
        <label for="modelInput">Model</label>
        <input list="modelList" id="modelInput" placeholder="e.g. Corolla" />
        <datalist id="modelList"></datalist>
      </div>

      <div class="field field-row">
        <div>
          <label for="yearMin">Year from</label>
          <input type="number" id="yearMin" placeholder="2010" />
        </div>
        <div>
          <label for="yearMax">Year to</label>
          <input type="number" id="yearMax" placeholder="2026" />
        </div>
      </div>

      <div class="field field-row">
        <div>
          <label for="priceMin">Price from (PKR)</label>
          <input type="number" id="priceMin" placeholder="500000" />
        </div>
        <div>
          <label for="priceMax">Price to (PKR)</label>
          <input type="number" id="priceMax" placeholder="5000000" />
        </div>
      </div>

      <button id="applyFilters" class="btn-secondary">Apply filters</button>
      <button id="resetFilters" class="btn-ghost">Reset</button>
    </aside>

    <section class="results">
      <div class="results-header">
        <h2 id="resultsCount">0 listings</h2>
        <p class="results-hint">Sorted by most recently scraped</p>
      </div>

      <div id="resultsGrid" class="grid"></div>

      <div id="emptyState" class="empty-state">
        <p>No listings yet.</p>
        <p class="empty-sub">Hit <strong>Scrape live data</strong> above to pull the latest cars from PakWheels.</p>
      </div>
    </section>

  </main>

  <template id="cardTemplate">
    <article class="car-card">
      <div class="car-image">
        <img src="" alt="" loading="lazy" />
      </div>
      <div class="car-body">
        <h3 class="car-title"></h3>
        <div class="odometer" title="Listed price">
          <span class="odometer-currency">PKR</span>
          <span class="odometer-value"></span>
        </div>
        <div class="chips">
          <span class="chip chip-year"></span>
          <span class="chip chip-mileage"></span>
          <span class="chip chip-fuel"></span>
          <span class="chip chip-transmission"></span>
        </div>
        <div class="car-meta">
          <span class="car-city"></span>
          <a class="car-link" href="#" target="_blank" rel="noopener">View on PakWheels →</a>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
